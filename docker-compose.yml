# Deployment only: `docker compose --profile full up -d --build`. Locally, run `pnpm dev` so no extra
# containers use up the Docker VM's RAM.

services:
  web:
    profiles: [full]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-3500}:3000"
